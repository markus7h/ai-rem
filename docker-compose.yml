services:
  ai-rem:
    # :latest bringt das in-process Embedding-Modell mit (laeuft ohne externen
    # Dienst). :latest-slim ist ~250 MB kleiner und setzt EMBED_URL voraus.
    image: magic3arkus/ai-rem:${AI_REM_TAG:-latest}
    build: .
    container_name: ai-rem
    networks:
      default:
        # Feste Adresse, damit der Reverse-Proxy den Container direkt
        # adressieren kann (Host-ID = Port, nur zur Lesbarkeit).
        ipv6_address: fd00:24:9:68:19::3456
    restart: unless-stopped
    ports:
      - "${PORT:-3456}:${PORT:-3456}"
    volumes:
      - ${KG_DATA_PATH:-./data}:/data
      - ${KG_BACKUP_PATH:-./backups}:/backups
      # Persoenliche Setup-Config read-only reinreichen. Das Docker-Hub-Image
      # enthaelt nur setup-config.example.json — ohne diesen Mount liefert
      # /setup-config die Platzhalter (ollama_url: http://your-server:11434) und
      # jede Neuinstallation bekommt eine tote llama-URL ins settings-template.
      - ./setup-config.json:/app/setup-config.json:ro
    environment:
      # Dual-stack: der Container ist ueber IPv6 UND den published
      # IPv4-Port erreichbar (server.py setzt IPV6_V6ONLY=0).
      - "HOST=::"
      - PORT=${PORT:-3456}
      - KUZU_DB_PATH=/data/kg.db
      - KG_PUBLIC_URL=${KG_PUBLIC_URL:-http://localhost:${PORT:-3456}}
      # llama-server für den nicht-destruktiven Nightly-Cleanup (Merge-Urteile + Zusammenfassungen).
      # Default zeigt auf qwen3-14B auf myai; pro Deployment via .env überschreibbar.
      # (Vorher myubuntu:11434 — dort ist llm-mistral seit 2026-08-04 dauerhaft gestoppt.)
      # Ohne Erreichbarkeit läuft der Cleanup weiter, schiebt aber unklare Fälle nur in die Review-Queue.
      - AI_REM_OLLAMA_URL=${AI_REM_OLLAMA_URL:-http://myai:11436}
      - BACKUP_DIR=/backups
      - MAX_BACKUPS=${MAX_BACKUPS:-10}
      # Anzahl gepinnter Routinen, die /discover je Prompt injiziert (Slots,
      # kuratiert über pinned + sort_order in den Preferences)
      - DISCOVER_ROUTINES_LIMIT=${DISCOVER_ROUTINES_LIMIT:-10}
      - KUZU_POOL_SIZE=${KUZU_POOL_SIZE:-4}
      # Kuzu Buffer-Pool in MiB. Ohne dieses Limit zielt kuzu auf 80% des HOST-RAMs
      # (ignoriert mem_limit). Normalbetrieb braucht bei dieser DB nur ~32 MB → 256 üppig.
      - KUZU_BUFFER_POOL_SIZE_MB=${KUZU_BUFFER_POOL_SIZE_MB:-256}
      # WAL selbst mergen, sobald sie diese Größe überschreitet (+ beim Shutdown).
      # Verhindert eine aufgestaute WAL, die beim Öffnen teure Recovery (→ OOM) auslöst.
      - KUZU_WAL_CHECKPOINT_MB=${KUZU_WAL_CHECKPOINT_MB:-2}
      # Pflicht (fail-closed): ohne Token startet der Server nicht. Quelle:
      # mykeyvault (Item ai-rem-api-token), via deploy.sh in die .env geschrieben.
      - AI_REM_API_TOKEN=${AI_REM_API_TOKEN:?AI_REM_API_TOKEN nicht gesetzt — siehe deploy.sh / .env}
      # Optional: gesetzt → Backups werden mit AES-256-GCM verschlüsselt
      # (backup_<ts>.json.enc), leer → Klartext wie bisher. Quelle: mykeyvault
      # (Item ai-rem-backup-key), via deploy.sh in die .env geschrieben.
      - AI_REM_BACKUP_KEY=${AI_REM_BACKUP_KEY:-}
      # Embeddings für die semantische Suche. Leer = in-process (fastembed/MiniLM,
      # im Image enthalten, kein externer Dienst). Gesetzt = OpenAI-kompatibler
      # Endpoint, z.B. http://myai:11435/v1/embeddings — dann laesst sich das
      # kleinere Image :latest-slim nutzen (ohne fastembed und Modell).
      # Ein Wechsel rechnet beim naechsten Start alle Vektoren neu (andere Dimension);
      # ist der Dienst nicht erreichbar, faellt die Suche auf rein lexikalisch zurueck.
      - EMBED_URL=${EMBED_URL:-}
      - EMBED_HTTP_MODEL=${EMBED_HTTP_MODEL:-bge-m3}
      # Laengenbremse: llama.cpp lehnt zu lange Eingaben mit HTTP 500 ab, statt sie
      # wie fastembed still zu kappen — das riss sonst ganze Backfill-Chunks mit.
      - EMBED_MAX_CHARS=${EMBED_MAX_CHARS:-2000}
      # ACHTUNG bei EMBED_URL: externe Modelle liefern deutlich groessere Vektoren
      # (bge-m3 1024 statt 384 Dimensionen). Mit dem 256-MB-Default scheitert beim
      # Backfill der WAL-Checkpoint ("buffer pool is full") — die Writes bleiben in
      # der WAL und sind nach dem naechsten Start wieder weg. 512 MB Pool und ~1.25 GB
      # mem_limit tragen 685 Entities.
      # Cosine-Schwelle der semantischen Treffer. Leer = passender Default je
      # Backend (0.45 in-process, 0.50 fuer bge-m3).
      - EMBED_THRESHOLD=${EMBED_THRESHOLD:-}
    # Betrieb ~700 MiB (Embedding-Modell ~575 + kuzu ~32 + Python). WAL wird klein
    # gehalten (KUZU_WAL_CHECKPOINT_MB), daher kein 2.4-GiB-Recovery-Peak mehr.
    # Mit EMBED_URL + :latest-slim faellt das Modell weg → 512m reichen.
    mem_limit: ${MEM_LIMIT:-1536m}
    healthcheck:
      # /health ist public (kein Token) — bewusst, damit der Healthcheck ohne Secret auskommt.
      test: ["CMD-SHELL", "python -c \"import urllib.request,os; p=os.getenv('PORT','3456'); urllib.request.urlopen(f'http://localhost:{p}/health',timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  # IPv6 aus dem gerouteten Praefix fd00:24:9:68::/64 (Rueckroute im Router auf
  # den Docker-Host). gateway_mode_ipv6=routed -> kein NAT66, Container treten
  # mit ihrer echten Adresse auf. Fuer andere Deployments Praefix anpassen oder
  # enable_ipv6 entfernen. IPv4-Subnetz explizit, sonst vergibt Docker es beim
  # Neuanlegen anders.
  default:
    name: ai-rem_default
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.19.0.0/16
        - subnet: fd00:24:9:68:19::/80
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv6: routed
