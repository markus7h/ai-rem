# Dependabot-Bumps ohne Handarbeit: Patch- und Minor-Updates bekommen Auto-Merge
# (squash). GitHub mergt erst, wenn die Pflicht-Checks der Branch-Protection
# (lint-compile, tests, image-smoke) grün sind — die CI bleibt das Gate.
# Major-Updates bleiben manuell, die brechen eher API/Verhalten.
name: Dependabot Auto-Merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
      - if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
