name: Docker Hub Release

on:
  push:
    tags:
      - 'v*'
  # Manueller README-Sync nach Docker Hub, ohne ein neues Release zu taggen.
  # Baut/pusht KEIN Image — aktualisiert nur die full_description aus README.md.
  workflow_dispatch: {}

jobs:
  build-and-push:
    # Nur bei Tag-Push bauen + pushen. Beim manuellen Dispatch übersprungen.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version tag
        id: meta
        run: echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: VERSION ↔ Tag-Konsistenz
        # Kein Release-/Code-Drift: VERSION in server.py muss dem Tag entsprechen
        # (Tag v1.2.3 → VERSION "1.2.3"). Bei Mismatch hart fehlschlagen.
        run: |
          set -euo pipefail
          CODE_VERSION=$(python3 -c "import re,sys; m=re.search(r'^VERSION\s*=\s*[\"\x27]([^\"\x27]+)', open('server.py').read(), re.M); print(m.group(1) if m else sys.exit('VERSION nicht in server.py gefunden'))")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "server.py VERSION = ${CODE_VERSION}"
          echo "Tag             = ${GITHUB_REF_NAME} (→ ${TAG_VERSION})"
          if [ "$CODE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::VERSION (${CODE_VERSION}) ≠ Tag (${TAG_VERSION}) — server.py:44 vor dem Tag anpassen."
            exit 1
          fi
          echo "✅ VERSION und Tag stimmen überein."

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            magic3arkus/ai-rem:${{ steps.meta.outputs.version }}
            magic3arkus/ai-rem:latest

      - name: Build and push (slim, ohne in-process Embeddings)
        # Gleicher Code, nur ohne fastembed und Modell-Cache (~312 MB weniger).
        # Braucht zur Laufzeit EMBED_URL, sonst laeuft die Suche rein lexikalisch.
        # Die Layer bis pip install teilt er sich mit dem Build darueber.
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: EMBED_BACKEND=external
          tags: |
            magic3arkus/ai-rem:${{ steps.meta.outputs.version }}-slim
            magic3arkus/ai-rem:latest-slim

  prune-tags:
    # Räumt alte Docker-Hub-Tags auf. Bei Tag-Push nach erfolgreichem Build; per
    # manuellem workflow_dispatch on-demand (dann ohne Build, höchstes vorhandenes
    # Tag gilt als "aktuell"). Behält: latest + aktuelle Version + 3 neueste Patch-
    # Tags derselben Minor-Serie + 1 höchstes Tag einer älteren Minor-Serie.
    # Löscht den Rest der vX.Y.Z-Tags (latest/Nicht-Semver bleiben unberührt).
    needs: [build-and-push]
    if: >-
      always() && (github.event_name == 'workflow_dispatch'
      || (startsWith(github.ref, 'refs/tags/v') && needs.build-and-push.result == 'success'))
    runs-on: ubuntu-latest
    steps:
      - name: Prune old tags
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          REPO: magic3arkus/ai-rem
          CURRENT: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, sys, urllib.request, urllib.error

          repo    = os.environ["REPO"]
          current = os.environ.get("CURRENT", "")
          user    = os.environ["DOCKERHUB_USERNAME"]
          pw      = os.environ["DOCKERHUB_TOKEN"]
          base    = "https://hub.docker.com/v2"
          # -slim gehoert zur selben Version wie das Default-Tag: beide werden
          # zusammen gebaut und muessen zusammen behalten oder geloescht werden.
          SEMVER  = re.compile(r"^v(\d+)\.(\d+)\.(\d+)(?:-slim)?$")

          def ver(tag):
              m = SEMVER.match(tag or "")
              return tuple(int(x) for x in m.groups()) if m else None

          # --- Docker Hub JWT ---
          req = urllib.request.Request(
              f"{base}/users/login",
              data=json.dumps({"username": user, "password": pw}).encode(),
              headers={"Content-Type": "application/json"}, method="POST")
          jwt = json.loads(urllib.request.urlopen(req, timeout=15).read())["token"]
          if not jwt:
              print("::error::Docker Hub login lieferte kein JWT.")
              sys.exit(1)
          auth = {"Authorization": f"JWT {jwt}"}

          # --- Alle Tags paginiert holen ---
          tags, url = [], f"{base}/repositories/{repo}/tags?page_size=100"
          while url:
              r = json.loads(urllib.request.urlopen(
                  urllib.request.Request(url, headers=auth), timeout=15).read())
              tags += [t["name"] for t in r.get("results", [])]
              url = r.get("next")

          versions = [(ver(t), t) for t in tags if ver(t)]

          # --- "Aktuelle" Version bestimmen ---
          # Tag-Push: aus dem Ref (CURRENT). Sonst (workflow_dispatch): höchstes
          # vorhandenes vX.Y.Z-Tag auf Docker Hub als aktuell annehmen.
          cur = ver(current)
          if cur is None:
              if not versions:
                  print("Keine vX.Y.Z-Tags vorhanden — nichts zu tun.")
                  sys.exit(0)
              cur, current = max(versions)
              print(f"Kein Versions-Ref übergeben → '{current}' als aktuell angenommen.")

          # --- Keep-Set berechnen ---
          # Ueber Versionsnummern statt Tag-Namen, damit vX.Y.Z und vX.Y.Z-slim
          # gemeinsam zaehlen und nicht als zwei der drei Patch-Slots durchgehen.
          uniq = sorted({v for v, _ in versions}, reverse=True)
          same_minor = [v for v in uniq if v[:2] == cur[:2] and v < cur][:3]
          older_series = [v for v in uniq if v[:2] < cur[:2]]
          keep = {cur, *same_minor}
          if older_series:
              keep.add(older_series[0])      # höchste Version der nächst-älteren Minor-Serie

          delete = sorted(((v, t) for v, t in versions if v not in keep), reverse=True)

          print(f"Aktuell:  {current}")
          print("Behalten: latest, latest-slim, "
                + ", ".join("v%d.%d.%d(-slim)" % v for v in sorted(keep, reverse=True)))
          if not delete:
              print("Nichts zu löschen.")
              sys.exit(0)

          for _, tag in delete:
              dreq = urllib.request.Request(
                  f"{base}/repositories/{repo}/tags/{tag}/", headers=auth, method="DELETE")
              try:
                  urllib.request.urlopen(dreq, timeout=15)
                  print(f"  gelöscht: {tag}")
              except urllib.error.HTTPError as e:
                  print(f"::warning::Löschen von {tag} fehlgeschlagen (HTTP {e.code})")
          print(f"✅ {len(delete)} alte Tags entfernt.")
          PY

  update-description:
    # Läuft nach erfolgreichem Build bei Tag-Push UND eigenständig beim manuellen Dispatch.
    needs: [build-and-push]
    if: always() && (github.event_name == 'workflow_dispatch' || needs.build-and-push.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Update Docker Hub description from docs/dockerhub.md
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Eigene Landing-Page (statt der wachsenden README), mit absoluten GitHub-Links —
          # relative Links rendern auf Docker Hub nicht. Größe so vom 25k-Limit entkoppelt.
          DESC_FILE="docs/dockerhub.md"
          SHORT_DESC="Persistent knowledge-graph memory for Claude Code — self-hosted MCP server"

          # Docker Hub deckelt full_description bei 25000 (Bytes) und description bei 100 (Zeichen).
          # Hart fehlschlagen, statt — wie früher — still ein abgelehntes PATCH zu schlucken.
          BYTES=$(wc -c < "$DESC_FILE")
          echo "${DESC_FILE}: ${BYTES} bytes"
          if [ "$BYTES" -gt 25000 ]; then
            echo "::error::${DESC_FILE} (${BYTES} bytes) exceeds Docker Hub's 25000-byte full_description limit."
            exit 1
          fi
          SHORT_LEN=$(printf '%s' "$SHORT_DESC" | wc -m | tr -d ' ')
          if [ "$SHORT_LEN" -gt 100 ]; then
            echo "::error::short description (${SHORT_LEN} chars) exceeds Docker Hub's 100-char limit."
            exit 1
          fi

          echo "→ Docker Hub login"
          TOKEN=$(curl -s -X POST "https://hub.docker.com/v2/users/login" \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"${DOCKERHUB_USERNAME}\",\"password\":\"${DOCKERHUB_TOKEN}\"}" \
            | jq -r '.token // empty')
          if [ -z "$TOKEN" ]; then
            echo "::error::Docker Hub login returned no JWT. DOCKERHUB_TOKEN must be the account password (or a PAT the hub.docker.com web API accepts) — a registry-only PAT does not work for the description endpoint."
            exit 1
          fi

          echo "→ PATCH description + full_description"
          BODY=$(jq -n --arg sd "$SHORT_DESC" --rawfile fd "$DESC_FILE" \
                   '{description: $sd, full_description: $fd}')
          STATUS=$(printf '%s' "$BODY" \
            | curl -s -o /tmp/dh_resp.json -w '%{http_code}' \
                -X PATCH "https://hub.docker.com/v2/repositories/magic3arkus/ai-rem/" \
                -H "Authorization: JWT ${TOKEN}" \
                -H "Content-Type: application/json" \
                -d @-)
          echo "HTTP ${STATUS}"
          if [ "$STATUS" != "200" ]; then
            echo "Response:"; cat /tmp/dh_resp.json || true
            echo "::error::Docker Hub description update failed (HTTP ${STATUS})"
            exit 1
          fi
          echo "✅ Docker Hub synced: full_description from ${DESC_FILE} (${BYTES} bytes) + short description (${SHORT_LEN} chars)"
