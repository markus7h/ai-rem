name: CI

# Tier-1-Gate (Issue #26): billiges, verlässliches Gate auf jedem Push/PR.
# Fängt die Fehlerklasse ab, die uns real getroffen hat (z.B. `global`-vor-Benutzung-
# SyntaxError), die sonst nur durch manuellen py_compile aufgefallen wäre.

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  lint-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime deps + ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          pip install -r requirements.txt

      - name: Ruff (kritische Fehlerklassen)
        # Bewusst eng: Syntaxfehler (E9) + undefinierte/ungenutzte Namen, falsche
        # Vergleiche (F-Klassen). Kein Style-Flood auf dem bestehenden 5,5k-Zeilen-Server.
        run: ruff check --select E9,F63,F7,F82 .

      - name: Compile-Smoke
        run: python -m compileall -q server.py lib

      - name: Import-Smoke (Wegwerf-Env)
        env:
          KUZU_DB_PATH: ${{ runner.temp }}/ci-kg.db
          AI_REM_API_TOKEN: ci-dummy-token
          EMBED_ENABLED: '0'
        run: python -c "import server; print('import OK, VERSION=', server.VERSION)"

  # Tier-3-Gate (Issue #28): die tests/ liefen bisher nirgends — jetzt gaten sie jeden
  # PR. Deckt Schema-Migration (Alt-Schema-Fixture), Backup→Restore-Roundtrip und
  # Graph-Invarianten ab. Jeder Test setzt KUZU_DB_PATH/BACKUP_DIR selbst auf tempdirs.
  tests:
    runs-on: ubuntu-latest
    env:
      EMBED_ENABLED: '0'
      AI_REM_API_TOKEN: ci-dummy-token
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime deps + pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements.txt

      - name: pytest
        run: pytest -q tests/

  # Tier-2-Gate (Issue #27): Image im PR bauen statt erst beim Tag-Push, und den
  # gestarteten Container per /health (DB-Ping) prüfen. Fängt Build-Breakage UND
  # einen beim Start wedged Container ab, bevor `latest` veröffentlicht wird —
  # `main` ist protected, also durchläuft der später getaggte Commit dieses Gate.
  # amd64-only: eine Arch reicht, um Breakage zu sehen; Multi-Arch bleibt dem Release.
  image-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (amd64, in den Runner-Docker laden)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ai-rem:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke — Container starten + /health pollen
        run: |
          set -euo pipefail
          docker run -d --name ai-rem-ci -e AI_REM_API_TOKEN=ci-smoke -p 3456:3456 ai-rem:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3456/health | grep -qx ok; then
              echo "✅ /health = ok (nach ${i}s)"; exit 0
            fi
            sleep 1
          done
          echo "::error::/health wurde nicht innerhalb von 30s healthy"
          docker logs ai-rem-ci || true
          exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f ai-rem-ci || true
