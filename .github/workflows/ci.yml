name: CI

# Tier-1-Gate (Issue #26): billiges, verlässliches Gate auf jedem Push/PR.
# Fängt die Fehlerklasse ab, die uns real getroffen hat (z.B. `global`-vor-Benutzung-
# SyntaxError), die sonst nur durch manuellen py_compile aufgefallen wäre.

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  lint-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install runtime deps + ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          pip install -r requirements.txt

      - name: Ruff (kritische Fehlerklassen)
        # Bewusst eng: Syntaxfehler (E9) + undefinierte/ungenutzte Namen, falsche
        # Vergleiche (F-Klassen). Kein Style-Flood auf dem bestehenden 5,5k-Zeilen-Server.
        run: ruff check --select E9,F63,F7,F82 .

      - name: Compile-Smoke
        run: python -m compileall -q server.py lib

      - name: Import-Smoke (Wegwerf-Env)
        env:
          KUZU_DB_PATH: ${{ runner.temp }}/ci-kg.db
          AI_REM_API_TOKEN: ci-dummy-token
          EMBED_ENABLED: '0'
        run: python -c "import server; print('import OK, VERSION=', server.VERSION)"

  # Tier-3-Gate (Issue #28): die tests/ liefen bisher nirgends — jetzt gaten sie jeden
  # PR. Deckt Schema-Migration (Alt-Schema-Fixture), Backup→Restore-Roundtrip und
  # Graph-Invarianten ab. Jeder Test setzt KUZU_DB_PATH/BACKUP_DIR selbst auf tempdirs.
  tests:
    runs-on: ubuntu-latest
    env:
      EMBED_ENABLED: '0'
      AI_REM_API_TOKEN: ci-dummy-token
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install runtime deps + pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements.txt

      - name: pytest
        run: pytest -q tests/

  # Tier-2-Gate (Issue #27): Image im PR bauen statt erst beim Tag-Push, und den
  # gestarteten Container per /health (DB-Ping) prüfen. Fängt Build-Breakage UND
  # einen beim Start wedged Container ab, bevor `latest` veröffentlicht wird —
  # `main` ist protected, also durchläuft der später getaggte Commit dieses Gate.
  # amd64-only: eine Arch reicht, um Breakage zu sehen; Multi-Arch bleibt dem Release.
  image-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image (amd64, in den Runner-Docker laden)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ai-rem:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke — Container starten + /health pollen
        run: |
          set -euo pipefail
          docker run -d --name ai-rem-ci -e AI_REM_API_TOKEN=ci-smoke -p 3456:3456 ai-rem:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3456/health | grep -qx ok; then
              echo "✅ /health = ok (nach ${i}s)"; exit 0
            fi
            sleep 1
          done
          echo "::error::/health wurde nicht innerhalb von 30s healthy"
          docker logs ai-rem-ci || true
          exit 1

      - name: Smoke — CLI ist vollstaendig installierbar
        # Das Setup zieht die CLI + ihre lib-Module hierher; bricht eine Route (oder
        # fehlt eine Datei im COPY), installiert jede Neuinstallation eine CLI, die
        # nicht startet — und Auto-Memory stirbt still.
        run: |
          set -euo pipefail
          mkdir -p cli-smoke/bin cli-smoke/lib
          curl -fsS http://localhost:3456/bin/ai-rem -o cli-smoke/bin/ai-rem
          for f in __init__.py mcp_client.py extractor.py extractor_heuristic.py; do
            curl -fsS "http://localhost:3456/lib/$f" -o "cli-smoke/lib/$f"
          done
          chmod +x cli-smoke/bin/ai-rem
          AI_REM_ENDPOINT=http://localhost:3456/mcp AI_REM_TOKEN=ci-smoke \
            ./cli-smoke/bin/ai-rem status

      - name: Cleanup
        if: always()
        run: docker rm -f ai-rem-ci || true

  changelog-entry:
    # Jeder PR muss im CHANGELOG landen — sonst steht am Ende weder im GitHub Release
    # noch in der Docker-Hub-Beschreibung, was sich geaendert hat. Der Check laeuft
    # bewusst nur auf PRs (auf einem Branch-Push gibt es noch keinen PR-Kontext).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: CHANGELOG.md wurde ergaenzt
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          # Dependabot schreibt keine Changelogs; seine Bumps werden beim Release
          # gesammelt nachgetragen — die Vollstaendigkeit sichert der verify-Schritt.
          case "$AUTHOR" in
            dependabot*|renovate*)
              echo "Automatischer Dependency-PR von ${AUTHOR} — uebersprungen."; exit 0 ;;
          esac
          case ",$LABELS," in
            *,no-changelog,*)
              echo "Label 'no-changelog' gesetzt — uebersprungen."; exit 0 ;;
          esac
          if git diff --name-only "$BASE" "$HEAD_SHA" | grep -qx "CHANGELOG.md"; then
            echo "✅ CHANGELOG.md ist Teil dieses PRs."
            exit 0
          fi
          echo "::error::Dieser PR aendert CHANGELOG.md nicht. Trag die Aenderung unter '## [Unreleased]' ein (oder setze das Label 'no-changelog', wenn wirklich nichts Nutzersichtbares passiert)."
          exit 1

      - name: Release-PR — alle gemergten PRs stehen im Abschnitt
        # Greift nur, wenn dieser PR die VERSION anfasst: dann wird gleich getaggt,
        # und ab da ist es zu spaet. Faengt auch die Dependabot-Luecke von oben.
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if ! git diff "$BASE" "$HEAD_SHA" -- server.py | grep -q '^+VERSION'; then
            echo "Kein Release-PR (VERSION unveraendert) — Vollstaendigkeitscheck entfaellt."
            exit 0
          fi
          VERSION=$(python3 -c "import re;print(re.search(r'^VERSION\s*=\s*[\"\x27]([^\"\x27]+)', open('server.py').read(), re.M).group(1))")
          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v*' "$BASE")
          echo "Release-PR: v${VERSION}, Vergleich gegen ${LAST_TAG}"
          python3 scripts/changelog.py verify "v${VERSION}" "$LAST_TAG" "$HEAD_SHA"
